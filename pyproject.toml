[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "dtu_mlops"
version = "0.0.1"
description = "The main goal of the project is to build production MLOps pipeline for development of ML project. As for ML goal, it is to do multi-class classification for CT images datasets (COPYPASTE the names!!!) from MedMNIST. Class labels describe which part of the body is mainly featured in the images"
authors = [
  { name = "Group 44", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "huggingface-hub>=1.3.2",
    "medmnist>=3.0.2",
    "hydra-core>=1.3.2",
    "pyyaml>=6.0.2",
    "torch==2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb==0.18.7",
    "gradio>=6.3.0",
    "torchdrift>=0.1.0.post1",
]

[project.optional-dependencies]
cpu = [
    "torch==2.6.0",
    "torchvision>=0.21.0",
]
cu118 = [
    "torch==2.6.0",
    "torchvision>=0.21.0",
]
cu124 = [
    "torch==2.6.0",
    "torchvision>=0.21.0",
]
cu126 = [
    "torch==2.6.0",
    "torchvision>=0.21.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
    "pytest-cov>=6.3.0",
    "pillow>=12.1.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
    ],
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
    [
        { extra = "cpu" },
        { extra = "cu126" },
    ],
    [
        { extra = "cu118" },
        { extra = "cu124" },
    ],
    [
        { extra = "cu118" },
        { extra = "cu126" },
    ],
    [
        { extra = "cu124" },
        { extra = "cu126" },
    ],
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
source = ["dtu_mlops"]
relative_files = true
omit = ["tests/*"]
disable_warnings = ["no-source"]
